services:
  catalog:
    image: badje-catalog:latest
    container_name: badje-catalog
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      UPLOAD_DIR: /data/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      CATALOG_RENDER_DPI: ${CATALOG_RENDER_DPI:-200}
      CATALOG_WEBP_QUALITY: ${CATALOG_WEBP_QUALITY:-96}
      CATALOG_WEBP_LOSSLESS: ${CATALOG_WEBP_LOSSLESS:-true}
    volumes:
      - ./uploads:/data/uploads
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
