name: Run Badje Catalog source import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and extract source
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/fix-000a.txt
          cat \
            .bootstrap/fix-000a.txt \
            .bootstrap/fix-000b.txt \
            .bootstrap/chunk-001.txt \
            .bootstrap/chunk-002.txt \
            .bootstrap/chunk-003.txt \
            .bootstrap/chunk-004.txt \
            .bootstrap/fix-005a.txt \
            .bootstrap/fix-005b.txt \
            .bootstrap/chunk-006.txt \
            .bootstrap/chunk-007.txt \
            .bootstrap/chunk-008.txt \
            .bootstrap/chunk-009.txt \
            .bootstrap/chunk-010.txt \
            .bootstrap/chunk-011a.txt \
            .bootstrap/chunk-011b.txt \
            .bootstrap/chunk-011c.txt \
            .bootstrap/chunk-011d.txt \
            > /tmp/source-prefix.b64
          base64 --decode /tmp/source-prefix.b64 > /tmp/source-prefix.bin
          python3 - <<'PY'
          import binascii
          import pathlib
          import struct
          import zlib

          data = pathlib.Path('/tmp/source-prefix.bin').read_bytes()
          root = pathlib.Path.cwd().resolve()
          pos = 0
          count = 0
          while pos + 4 <= len(data):
              sig = data[pos:pos+4]
              if sig == b'PK\x01\x02':
                  break
              if sig != b'PK\x03\x04':
                  raise SystemExit(f'Unexpected ZIP signature at {pos}: {sig!r}')
              if pos + 30 > len(data):
                  raise SystemExit('Truncated local ZIP header')
              fields = struct.unpack_from('<IHHHHHIIIHH', data, pos)
              _, _, flags, method, _, _, crc32, csize, usize, nlen, xlen = fields
              pos += 30
              name_raw = data[pos:pos+nlen]
              pos += nlen + xlen
              if flags & 0x08:
                  raise SystemExit('Unexpected data-descriptor ZIP entry')
              if pos + csize > len(data):
                  raise SystemExit('Truncated ZIP entry')
              compressed = data[pos:pos+csize]
              pos += csize
              name = name_raw.decode('utf-8' if flags & 0x800 else 'cp437')
              if method == 0:
                  payload = compressed
              elif method == 8:
                  payload = zlib.decompress(compressed, -15)
              else:
                  raise SystemExit(f'Unsupported ZIP method {method}: {name}')
              if len(payload) != usize:
                  raise SystemExit(f'Size mismatch: {name}')
              if (binascii.crc32(payload) & 0xffffffff) != crc32:
                  raise SystemExit(f'CRC mismatch: {name}')
              prefix = 'badje-catalog/'
              if not name.startswith(prefix):
                  raise SystemExit(f'Unexpected archive path: {name}')
              rel = name[len(prefix):]
              if not rel or rel.endswith('/'):
                  continue
              dest = (root / rel).resolve()
              if root not in dest.parents:
                  raise SystemExit(f'Unsafe archive path: {name}')
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(payload)
              count += 1
          print(f'Extracted {count} files')
          if count < 60:
              raise SystemExit(f'Expected at least 60 files, got {count}')
          PY
          test -f Dockerfile
          test -f docker-compose.yml
          test -f package.json
          test -f components/AdminDashboard.tsx
          test -f 'app/api/admin/catalogs/[id]/regenerate/route.ts'
          test -f pdf-engine/generate.py
          grep -q 'PolyForm Noncommercial' LICENSE.md
          grep -q 'Copyright 2026 Tooraj Valaee' LICENSE.md

      - name: Publish normal source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap BOOTSTRAP.md
          git config user.name "Tooraj Valaee"
          git config user.email "tooraj.valaee@live.com"
          git add -A
          git commit -m "Import Badje Catalog v3.2.0 source"
          git push origin HEAD:main
