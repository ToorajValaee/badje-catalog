name: Import project source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ hashFiles('.bootstrap/source.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/source.b64 > /tmp/badje-catalog.zip
          rm -rf /tmp/badje-catalog-import
          mkdir -p /tmp/badje-catalog-import
          unzip -q /tmp/badje-catalog.zip -d /tmp/badje-catalog-import
          rsync -a --delete --exclude='.git/' /tmp/badje-catalog-import/badje-catalog/ ./

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tooraj Valaee"
          git config user.email "tooraj.valaee@live.com"
          git add -A
          git commit -m "Import Badje Catalog v3.2.0 source"
          git push origin HEAD:main
