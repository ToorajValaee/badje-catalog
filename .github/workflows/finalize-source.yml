name: Finalize Badje Catalog repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f docker-compose.yml
          test -f package.json
          test -f components/AdminDashboard.tsx
          test -f 'app/api/admin/catalogs/[id]/regenerate/route.ts'
          test -f pdf-engine/generate.py
          test -f LICENSE.md
          grep -q 'PolyForm Noncommercial' LICENSE.md
          grep -q 'Copyright 2026 Tooraj Valaee' LICENSE.md
          test ! -d .bootstrap

      - name: Remove one-time importer workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-source.yml
          rm -f .github/workflows/import-source-prefix.yml
          rm -f .github/workflows/finalize-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          rm -rf .bootstrap BOOTSTRAP.md
          git config user.name "Tooraj Valaee"
          git config user.email "tooraj.valaee@live.com"
          git add -A
          git commit -m "Finalize Badje Catalog v3.2.0 repository"
          git push origin HEAD:main
