server {
    listen 443 ssl;
    server_name catalog.badje.ir;

    ssl_certificate     /etc/nginx/certs/badje.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/badje.ir/privkey.pem;

    client_max_body_size 200M;
    sendfile on;

    # Generated page images. Mount the host's uploads/generated directory
    # into the Nginx container at /data/catalog-assets:ro.
    location ^~ /_catalog_assets/ {
        alias /data/catalog-assets/;
        types { image/webp webp; application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Original PDF downloads are authorized by Next.js and then served
    # internally by Nginx. This path cannot be opened directly.
    location ^~ /_catalog_source/ {
        internal;
        alias /data/catalog-source/;
        default_type application/pdf;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    server_name catalog.badje.ir;
    return 301 https://$host$request_uri;
}
